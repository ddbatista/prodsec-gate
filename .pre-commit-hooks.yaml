# Consumable by any repo:
#   repos:
#     - repo: https://github.com/ddbatista/prodsec-gate
#       rev: v0.1.1
#       hooks: [{id: prodsec-gate}]
- id: prodsec-gate
  name: prodsec-gate (MCP tools/list vetting)
  description: >-
    Vet MCP server tool declarations for the lethal trifecta before they enter
    the agent catalogue. Offline and deterministic; exits 2 when nothing was
    audited, because that is a configuration failure rather than a pass.
  entry: prodsec-gate
  language: python
  # Committed tools/list dumps: name them <server>.tools.json. *dump*.json is
  # kept for existing layouts. NOT .mcp.json: that is a server config, not a
  # dump, and grading it fails every commit that touches it.
  files: '(^|/)[^/]+\.tools\.json$|(^|/)[^/]*dump[^/]*\.json$'
  pass_filenames: true
